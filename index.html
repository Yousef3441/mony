
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101827">
<title>کرایه مدرسه</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;padding:16px;background:#0b1220;color:#f4f7fb;
 font-family:Tahoma,Arial,sans-serif
}
main{max-width:650px;margin:auto}
h1{text-align:center;color:#50d6a0;font-size:25px}
p{line-height:1.8}
.card{
 background:#172338;border:1px solid #2b3b53;
 padding:17px;border-radius:16px;margin:14px 0
}
label{display:block;margin:12px 0 7px;color:#bdcadd}
input{
 width:100%;padding:13px;background:#0b1423;
 color:white;border:1px solid #344761;border-radius:10px;
 font:inherit
}
button{
 padding:12px;border:0;border-radius:10px;
 font:inherit;font-weight:bold;cursor:pointer
}
.primary{background:#50d6a0;color:#082018;width:100%;margin-top:15px}
.secondary{background:#293a53;color:white}
.danger{background:#702b38;color:white}
.row{display:flex;gap:8px;margin:12px 0}
.row button{flex:1}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:#22324a;padding:14px;border-radius:12px}
.stat strong{display:block;color:#50d6a0;margin-top:8px;font-size:15px;overflow-wrap:anywhere}
.muted{font-size:12px;color:#aab8cc}
.entry{border-bottom:1px solid #344761;padding:13px 0;line-height:2}
.entry button{margin-top:8px}
</style>
</head>

<body>
<main>
<h1>🎒 کرایه مدرسه</h1>
<p id="today" class="muted" style="text-align:center"></p>

<div class="stats">
 <div class="stat">کرایه امروز<strong id="todayTotal">۰ تومان</strong></div>
 <div class="stat">کرایه این ماه<strong id="monthTotal">۰ تومان</strong></div>
</div>

<section class="card">
<h3>📝 ثبت کرایه</h3>

<label for="date">تاریخ شمسی (مثلاً ۱۴۰۵/۰۷/۲۰)</label>
<input id="date" inputmode="numeric" placeholder="۱۴۰۵/۰۷/۲۰">

<label for="going">🚕 کرایه رفت (تومان)</label>
<input id="going" type="number" min="0" placeholder="مثلاً ۲۰۰۰۰">

<label for="returning">🏠 کرایه برگشت (تومان)</label>
<input id="returning" type="number" min="0" placeholder="مثلاً ۲۰۰۰۰">

<button class="primary" id="save">ذخیره کرایه‌ها</button>

<div class="row">
<button class="secondary" id="reminders">فعال‌کردن یادآوری</button>
<button class="secondary" id="backup">پشتیبان‌گیری</button>
</div>

<p class="muted">
اطلاعات در مرورگر همین دستگاه ذخیره می‌شود. برای جلوگیری از ازدست‌رفتن اطلاعات، مرتب پشتیبان بگیر.
</p>
</section>

<section class="card">
<h3>📊 گزارش هزینه‌ها</h3>
<div class="row">
<button class="secondary" id="week">این هفته</button>
<button class="secondary" id="month">این ماه</button>
</div>
<p>کرایه رفت: <strong id="reportGoing">۰</strong></p>
<p>کرایه برگشت: <strong id="reportReturn">۰</strong></p>
<p>مجموع: <strong id="reportTotal">۰</strong></p>
<p>روزهای ثبت‌شده: <strong id="reportDays">۰</strong></p>
</section>

<section class="card">
<h3>📅 سوابق کرایه</h3>
<div id="history"></div>
<div class="row">
<button class="secondary" id="restore">بازیابی پشتیبان</button>
<button class="danger" id="clear">پاک‌کردن همه</button>
</div>
<input type="file" id="file" accept=".json,application/json" hidden>
</section>
</main>

<!-- کتابخانه تبدیل تاریخ شمسی و میلادی -->
<script type="module">
import {
 toJalaali,
 toGregorian,
 isValidJalaaliDate
} from "https://cdn.jsdelivr.net/npm/jalaali-js@1.2.8/+esm";

const $ = id => document.getElementById(id);
const KEY = "schoolFareDataJalali";

let data = {};
let reportMode = "week";

try {
 data = JSON.parse(localStorage.getItem(KEY) || "{}");
} catch(e) {
 data = {};
}

const pad = n => String(n).padStart(2,"0");

function isoDate(d) {
 return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}

function jalaliText(d) {
 const j = toJalaali(
  d.getFullYear(), d.getMonth()+1, d.getDate()
 );
 return `${j.jy}/${pad(j.jm)}/${pad(j.jd)}`;
}

function normalizeDigits(value) {
 return value
  .replace(/[۰-۹]/g, c => "۰۱۲۳۴۵۶۷۸۹".indexOf(c))
  .replace(/[٠-٩]/g, c => "٠١٢٣٤٥٦٧٨٩".indexOf(c));
}

function parseJalali(value) {
 const s = normalizeDigits(value.trim()).replace(/-/g,"/");
 const m = s.match(/^(\d{4})\/(\d{1,2})\/(\d{1,2})$/);
 if(!m) return null;

 const jy=Number(m[1]), jm=Number(m[2]), jd=Number(m[3]);

 if(!isValidJalaaliDate(jy,jm,jd)) return null;

 const g=toGregorian(jy,jm,jd);
 return `${g.gy}-${pad(g.gm)}-${pad(g.gd)}`;
}

function fromISO(iso) {
 const [y,m,d]=iso.split("-").map(Number);
 return new Date(y,m-1,d,12);
}

function money(n) {
 return (Number(n)||0).toLocaleString("fa-IR")+" تومان";
}

function total(r) {
 return (Number(r.going)||0)+(Number(r.returning)||0);
}

function persist() {
 localStorage.setItem(KEY,JSON.stringify(data));
}

const now = new Date();
$("date").value = jalaliText(now);
$("today").textContent =
 "امروز: "+now.toLocaleDateString("fa-IR",{
  weekday:"long",year:"numeric",month:"long",day:"numeric"
 });

function jalaliMonthRange(date) {
 const j=toJalaali(date.getFullYear(),date.getMonth()+1,date.getDate());
 const start=toGregorian(j.jy,j.jm,1);
 let ny=j.jy,nm=j.jm+1;
 if(nm===13){nm=1;ny++;}
 const end=toGregorian(ny,nm,1);
 return {
  start:`${start.gy}-${pad(start.gm)}-${pad(start.gd)}`,
  end:`${end.gy}-${pad(end.gm)}-${pad(end.gd)}`
 };
}

function jalaliWeekRange(date) {
 // هفته شمسی از شنبه شروع می‌شود.
 const d=new Date(date.getFullYear(),date.getMonth(),date.getDate(),12);
 const day=d.getDay();
 d.setDate(d.getDate()-day);
 const start=isoDate(d);
 d.setDate(d.getDate()+7);
 return {start,end:isoDate(d)};
}

function render() {
 const now=new Date();
 const todayISO=isoDate(now);
 const monthRange=jalaliMonthRange(now);

 let monthTotal=0;
 Object.entries(data).forEach(([k,v])=>{
  if(k>=monthRange.start && k<monthRange.end)
   monthTotal+=total(v);
 });

 $("todayTotal").textContent=money(total(data[todayISO]||{}));
 $("monthTotal").textContent=money(monthTotal);

 const selected=parseJalali($("date").value);
 const selectedData=selected ? (data[selected]||{}) : {};
 $("going").value=selectedData.going ?? "";
 $("returning").value=selectedData.returning ?? "";

 const range=reportMode==="week"
  ? jalaliWeekRange(now)
  : jalaliMonthRange(now);

 let g=0,r=0,days=0;

 Object.entries(data).forEach(([key,v])=>{
  if(key>=range.start && key<range.end){
   g+=Number(v.going)||0;
   r+=Number(v.returning)||0;
   if(total(v)>0) days++;
  }
 });

 $("reportGoing").textContent=money(g);
 $("reportReturn").textContent=money(r);
 $("reportTotal").textContent=money(g+r);
 $("reportDays").textContent=days.toLocaleString("fa-IR");

 const keys=Object.keys(data)
  .filter(k=>total(data[k])>0)
  .sort((a,b)=>b.localeCompare(a));

 $("history").innerHTML="";

 if(!keys.length){
  $("history").textContent="هنوز کرایه‌ای ثبت نشده.";
 }

 keys.forEach(key=>{
  const v=data[key];
  const item=document.createElement("div");
  item.className="entry";

  const date=document.createElement("strong");
  date.textContent=jalaliText(fromISO(key));

  const details=document.createElement("div");
  details.textContent=
   `رفت: ${money(v.going)} | برگشت: ${money(v.returning)} | مجموع: ${money(total(v))}`;

  const del=document.createElement("button");
  del.className="danger";
  del.textContent="حذف این روز";
  del.onclick=()=>{
   if(confirm("این سابقه حذف شود؟")){
    delete data[key];
    persist();
    render();
   }
  };

  item.append(date,details,del);
  $("history").appendChild(item);
 });
}

$("save").onclick=()=>{
 const d=parseJalali($("date").value);
 const a=$("going").value;
 const b=$("returning").value;

 if(!d){
  alert("تاریخ شمسی معتبر وارد کن؛ مثل ۱۴۰۵/۰۷/۲۰");
  return;
 }

 if(a==="" && b===""){
  delete data[d];
 } else {
  if(Number(a)<0 || Number(b)<0){
   alert("هزینه نمی‌تواند منفی باشد.");
   return;
  }
  data[d]={going:Number(a)||0,returning:Number(b)||0};
 }

 persist();
 render();
 alert("کرایه‌ها ذخیره شد ✅");
};

$("date").addEventListener("change",render);

$("week").onclick=()=>{reportMode="week";render();};
$("month").onclick=()=>{reportMode="month";render();};

$("clear").onclick=()=>{
 if(confirm("همه سوابق پاک شوند؟")){
  data={};
  persist();
  render();
 }
};

$("backup").onclick=()=>{
 const blob=new Blob([JSON.stringify(data,null,2)],{
  type:"application/json"
 });
 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");
 a.href=url;
 a.download="school-fare-backup.json";
 a.click();
 URL.revokeObjectURL(url);
};

$("restore").onclick=()=>$("file").click();

$("file").onchange=async e=>{
 const f=e.target.files[0];
 if(!f)return;

 try{
  const restored=JSON.parse(await f.text());
  if(!restored || typeof restored!=="object" || Array.isArray(restored))
   throw Error();

  for(const [k,v] of Object.entries(restored)){
   if(!/^\d{4}-\d{2}-\d{2}$/.test(k) ||
      !v || typeof v!=="object" ||
      !Number.isFinite(Number(v.going)||0) ||
      !Number.isFinite(Number(v.returning)||0))
    throw Error();
  }

  if(confirm("اطلاعات فعلی با پشتیبان جایگزین شود؟")){
   data=restored;
   persist();
   render();
   alert("بازیابی انجام شد.");
  }
 }catch(err){
  alert("فایل پشتیبان معتبر نیست.");
 }
 e.target.value="";
};

// یادآوری ساعت ۷ و ۱۴؛ صفحه باید باز بماند.
let reminderInterval=null;

$("reminders").onclick=async()=>{
 if(!("Notification" in window)){
  alert("مرورگر از اعلان پشتیبانی نمی‌کند.");
  return;
 }

 const permission=await Notification.requestPermission();
 if(permission!=="granted"){
  alert("اجازه اعلان داده نشد.");
  return;
 }

 alert("یادآوری فعال شد؛ صفحه را باز نگه دار.");

 if(reminderInterval) clearInterval(reminderInterval);

 function checkTime(){
  const d=new Date();
  const hm=`${pad(d.getHours())}:${pad(d.getMinutes())}`;
  if(hm!=="07:00" && hm!=="14:00") return;

  const key=`fareReminder_${isoDate(d)}_${hm}`;
  if(localStorage.getItem(key)) return;

  new Notification("یادآوری کرایه مدرسه",{
   body:hm==="07:00"
    ?"وقت ثبت کرایه رفت مدرسه است."
    :"وقت ثبت کرایه برگشت مدرسه است."
  });

  localStorage.setItem(key,"1");
 }

 checkTime();
 reminderInterval=setInterval(checkTime,10000);
};

render();
</script>
</body>
</html>
